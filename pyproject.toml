[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wellbeing"
version = "0.1.0"
description = "Multimodal well-being monitoring system for elderly care"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "scipy>=1.12",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "redis>=5.0",
  "python-json-logger>=2.0",
]

[project.optional-dependencies]
# Vision extras are optional on purpose: the pipeline runs with stub adapters
# so that CI, tests and the API need no GPU and no downloaded weights.
vision = [
  "opencv-python-headless>=4.9",
  "torch>=2.2",
  "torchvision>=0.17",
  "ultralytics>=8.2",
  "faiss-cpu>=1.8",
]
ml = [
  "scikit-learn>=1.4",
  "pandas>=2.2",
]
dev = [
  "pytest>=8.1",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.9",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "SIM"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: end-to-end pipeline tests", "slow: requires model weights"]
